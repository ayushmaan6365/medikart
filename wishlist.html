<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Medical Equipment Wishlist - MediKart B2B</title>
  <meta name="description" content="View and manage shortlisted medical devices, ICU monitors, and surgical equipment on MediKart.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Header Mount -->
  <div id="header-mount"></div>

  <!-- Breadcrumb Navigation -->
  <div class="breadcrumb-container">
    <div class="container">
      <ul class="breadcrumb-list">
        <li class="breadcrumb-item"><a href="index.html">Home</a></li>
        <li class="breadcrumb-separator">/</li>
        <li class="breadcrumb-item active">Facility Wishlist</li>
      </ul>
    </div>
  </div>

  <main class="container" style="padding-bottom: 60px;">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; flex-wrap: wrap; gap: 14px;">
      <div>
        <h1 style="font-family: var(--font-heading); font-size: 1.8rem; font-weight: 800; color: var(--text-main);">
          Saved Medical Equipment Wishlist
        </h1>
        <p style="font-size: 0.88rem; color: #64748B;">
          Shortlist devices for upcoming ward expansions or budget approvals.
        </p>
      </div>

      <button class="btn-primary" onclick="moveAllWishlistToCart()" style="font-size: 0.84rem;">
        Move All to Procurement Cart
      </button>
    </div>

    <div id="wishlist-grid-wrapper">
      <!-- Injected by JS -->
    </div>
  </main>

  <!-- Footer Mount -->
  <div id="footer-mount"></div>

  <!-- Scripts -->
  <script src="js/products-data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderWishlist();
    });

    function renderWishlist() {
      const container = document.getElementById("wishlist-grid-wrapper");
      if (!container) return;

      const wishlistIds = Store.getWishlist();
      const allProducts = Store.getProducts();
      const savedProducts = allProducts.filter(p => wishlistIds.includes(p.id));

      if (savedProducts.length === 0) {
        container.innerHTML = `
          <div style="background: #FFFFFF; border: 1px solid var(--border-color); border-radius: 20px; padding: 60px 24px; text-align: center; max-width: 600px; margin: 20px auto;">
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.5" style="margin-bottom: 14px;">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
            <h3 style="font-family: var(--font-heading); font-size: 1.3rem; font-weight: 800; color: var(--text-main); margin-bottom: 8px;">
              Your Wishlist is Empty
            </h3>
            <p style="font-size: 0.88rem; color: #64748B; margin-bottom: 20px;">
              Save items by clicking the heart icon on any medical product card to monitor prices and bulk slabs.
            </p>
            <a href="category.html" class="btn-primary">Browse Catalogue</a>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="product-grid-4">
          ${savedProducts.map(p => `
            <div class="product-card" id="wish-card-${p.id}">
              <div class="product-badges">
                <span class="badge-discount">${Math.round(((p.mrp - p.price) / p.mrp) * 100)}% OFF</span>
              </div>

              <a href="product.html?id=${p.id}" class="product-thumb-link">
                <img src="${p.images[0]}" alt="${p.name}" class="product-thumb-img"/>
              </a>

              <div class="product-body">
                <span class="product-brand">${p.brand}</span>
                <a href="product.html?id=${p.id}" class="product-title">${p.name}</a>

                <div class="product-rating-row">
                  <span class="star-rating-pill">${p.rating}★</span>
                  <span class="rating-count">(${p.reviewsCount})</span>
                </div>

                <div class="product-price-block">
                  <span class="price-main">${formatINR(p.price)}</span>
                  <span class="price-mrp">${formatINR(p.mrp)}</span>
                  <span class="price-gst-tag">Incl. 18% GST</span>
                </div>

                <div style="display: flex; gap: 8px; margin-top: 10px;">
                  <button class="btn-add-cart" style="flex: 1;" onclick="moveWishItemToCart('${p.id}')">
                    Move to Cart
                  </button>
                  <button onclick="removeWishItem('${p.id}')" title="Remove from wishlist" style="color: #94A3B8; padding: 8px; border-radius: 8px;" onmouseover="this.style.color='#DC2626'" onmouseout="this.style.color='#94A3B8'">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                  </button>
                </div>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function removeWishItem(id) {
      Store.toggleWishlist(id);
      renderWishlist();
      showToast("Removed from Wishlist", "warning");
    }

    function moveWishItemToCart(id) {
      Store.addToCart(id, 1);
      Store.toggleWishlist(id);
      renderWishlist();
      showToast("Moved equipment to Procurement Cart", "success");
    }

    function moveAllWishlistToCart() {
      const ids = Store.getWishlist();
      if (ids.length === 0) return;

      ids.forEach(id => Store.addToCart(id, 1));
      ids.forEach(id => Store.toggleWishlist(id));
      renderWishlist();
      showToast("All shortlisted items moved to cart!", "success");
    }
  </script>
</body>
</html>
