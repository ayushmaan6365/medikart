<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Orders & Bio-Tracking - MediKart B2B</title>
  <meta name="description" content="Track hospital equipment dispatches, reorder consumables, and review past GST tax invoices on MediKart.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Header Mount -->
  <div id="header-mount"></div>

  <!-- Breadcrumb Navigation -->
  <div class="breadcrumb-container">
    <div class="container">
      <ul class="breadcrumb-list">
        <li class="breadcrumb-item"><a href="index.html">Home</a></li>
        <li class="breadcrumb-separator">/</li>
        <li class="breadcrumb-item"><a href="account.html">Account</a></li>
        <li class="breadcrumb-separator">/</li>
        <li class="breadcrumb-item active">Procurement History</li>
      </ul>
    </div>
  </div>

  <main class="container" style="padding-bottom: 60px;">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; flex-wrap: wrap; gap: 14px;">
      <div>
        <h1 style="font-family: var(--font-heading); font-size: 1.8rem; font-weight: 800; color: var(--text-main);">
          Hospital Orders & Dispatch Tracking
        </h1>
        <p style="font-size: 0.88rem; color: #64748B;">
          Review calibration status, courier consignment numbers, and download official GST invoices.
        </p>
      </div>
      <a href="category.html" class="btn-primary" style="font-size: 0.85rem;">
        + New Procurement Order
      </a>
    </div>

    <!-- Orders List Container -->
    <div id="orders-list-container">
      <!-- Injected by JS -->
    </div>
  </main>

  <!-- Footer Mount -->
  <div id="footer-mount"></div>

  <!-- Scripts -->
  <script src="js/products-data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderOrdersList();
    });

    function renderOrdersList() {
      const container = document.getElementById("orders-list-container");
      if (!container) return;

      const orders = Store.getOrders();
      if (orders.length === 0) {
        container.innerHTML = `
          <div style="background: #FFFFFF; border: 1px solid var(--border-color); border-radius: 20px; padding: 60px 24px; text-align: center; max-width: 600px; margin: 20px auto;">
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.5" style="margin-bottom: 14px;"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
            <h3 style="font-family: var(--font-heading); font-size: 1.3rem; font-weight: 800; color: var(--text-main); margin-bottom: 8px;">No Orders Recorded Yet</h3>
            <p style="font-size: 0.88rem; color: #64748B; margin-bottom: 20px;">Your hospital facility hasn't placed any equipment requests yet.</p>
            <a href="category.html" class="btn-primary">Browse Catalogue</a>
          </div>
        `;
        return;
      }

      container.innerHTML = orders.map(order => {
        let statusBadgeClass = "packed";
        if (order.status.toLowerCase() === "shipped") statusBadgeClass = "shipped";
        if (order.status.toLowerCase() === "delivered") statusBadgeClass = "delivered";

        const itemsHtml = order.items.map(item => `
          <div class="order-item-row" style="display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border-light); font-size: 0.86rem; gap: 12px;">
            <div style="display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1;">
              <img src="${item.image}" alt="${item.name}" style="width: 48px; height: 48px; object-fit: contain; background: #F8FAFC; border-radius: 6px; border: 1px solid var(--border-color); padding: 2px; flex-shrink: 0;" onerror="this.src='https://placehold.co/50x50?text=Item'"/>
              <div style="min-width: 0; flex: 1;">
                <a href="product.html?id=${item.id}" style="font-weight: 700; color: var(--text-main); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${item.name}</a>
                <div style="font-size: 0.76rem; color: #64748B;">SKU: ${item.sku} • Qty: <strong>${item.quantity}</strong></div>
              </div>
            </div>
            <div style="font-weight: 700; color: var(--primary); flex-shrink: 0;" class="tabular-nums">
              ${formatINR(item.price * item.quantity)}
            </div>
          </div>
        `).join("");

        // Tracking steps
        const trackingHtml = (order.tracking || []).map(t => `
          <div style="display: flex; align-items: center; gap: 8px; font-size: 0.78rem;">
            <span style="width: 10px; height: 10px; border-radius: 50%; background: ${t.done ? '#059669' : '#CBD5E1'}; display: inline-block;"></span>
            <span style="font-weight: ${t.done ? '700' : '500'}; color: ${t.done ? 'var(--text-main)' : '#94A3B8'};">${t.step}</span>
            <span style="color: #94A3B8;">(${t.date})</span>
          </div>
        `).join("");

        return `
          <div class="order-card">
            <!-- Card Header -->
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; margin-bottom: 16px; flex-wrap: wrap; gap: 12px;">
              <div>
                <span style="font-size: 0.75rem; text-transform: uppercase; color: #64748B; font-weight: 700; letter-spacing: 0.5px;">Order Reference</span>
                <div style="font-family: var(--font-heading); font-size: 1.25rem; font-weight: 800; color: var(--text-main);">
                  ${order.id}
                </div>
                <span style="font-size: 0.78rem; color: #94A3B8;">Placed on ${order.date} • Deliver to: ${order.shippingAddress ? (order.shippingAddress.hospital || order.shippingAddress.name) : 'Hospital'}</span>
              </div>

              <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                <span class="status-badge ${statusBadgeClass}">
                  <span style="width: 6px; height: 6px; border-radius: 50%; background: currentColor;"></span>
                  ${order.status}
                </span>

                <a href="success.html?orderId=${order.id}" class="btn-secondary" style="color: var(--primary); border-color: var(--primary); padding: 6px 14px; font-size: 0.8rem; background: var(--primary-soft);">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                  GST Invoice
                </a>

                <button class="btn-primary" style="padding: 6px 16px; font-size: 0.8rem;" onclick="handleReorder('${order.id}')">
                  Reorder All
                </button>
              </div>
            </div>

            <!-- Items -->
            <div style="margin-bottom: 16px;">
              ${itemsHtml}
            </div>

            <!-- Tracking Timeline & Total -->
            <div style="display: flex; justify-content: space-between; align-items: center; background: #F8FAF9; padding: 14px 18px; border-radius: 12px; border: 1px solid var(--border-light); flex-wrap: wrap; gap: 16px;">
              <div style="display: flex; gap: 16px; flex-wrap: wrap;">
                ${trackingHtml}
              </div>

              <div style="text-align: right;">
                <span style="font-size: 0.75rem; color: #64748B;">Total (Incl. 18% GST):</span>
                <div style="font-size: 1.25rem; font-weight: 800; color: var(--primary);" class="tabular-nums">
                  ${formatINR(order.total)}
                </div>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    function handleReorder(orderId) {
      const orders = Store.getOrders();
      const order = orders.find(o => o.id === orderId);
      if (!order) return;

      order.items.forEach(item => {
        Store.addToCart(item.id, item.quantity);
      });

      showToast(`Items from Order #${order.id} added to cart!`, "success");
      setTimeout(() => {
        window.location.href = "cart.html";
      }, 500);
    }
  </script>
</body>
</html>
